name: Feature Request
description: Suggest a new feature or improvement for sqlsage4j
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the feature you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is this related to a frustration?
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like. Include API sketches or code examples if possible.
      render: java
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of sqlsage4j does this relate to?
      options:
        - QueryChat (text-to-SQL)
        - LLMChat (conversational AI)
        - LLMDiff (A/B testing)
        - Vector store / embeddings
        - LLM client / provider
        - Prompt engineering
        - Training pipeline
        - Database connectors
        - Export / visualization
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references.
