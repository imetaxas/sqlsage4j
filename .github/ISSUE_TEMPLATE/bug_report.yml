name: Bug Report
description: Report a bug in sqlsage4j
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or steps to reproduce the issue.
      placeholder: |
        1. Create a SqlSage4j instance with ...
        2. Call chat.ask("...")
        3. Observe ...
      render: java
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or stack traces if applicable.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: sqlsage4j Version
      placeholder: e.g., 0.1.0-SNAPSHOT
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      placeholder: e.g., Java 17.0.9, Java 21.0.1
    validations:
      required: true

  - type: dropdown
    id: vector-store
    attributes:
      label: Vector Store Backend
      options:
        - InMemoryEmbeddingsStorage
        - LuceneEmbeddingsStorage
        - H2EmbeddingsStorage
        - SQLiteEmbeddingsStorage
        - HnswEmbeddingsStorage
        - LSHEmbeddingsStorage
        - Custom implementation
        - N/A
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem (logs, screenshots, environment details).
