<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-brand" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1DB954"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#f8fafc"/>
  <rect width="900" height="52" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="40" width="900" height="12" fill="url(#headerGrad)"/>

  <!-- Title -->
  <text x="450" y="33" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="600" letter-spacing="0.5">sqlsage4j  &#8212;  RAG Pipeline Architecture</text>

  <!-- ========== ROW 1: Input ========== -->
  <!-- User Question -->
  <rect x="30" y="72" width="160" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="96" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">User Question</text>
  <text x="110" y="114" text-anchor="middle" fill="#64748b" font-size="10">"Top 10 customers?"</text>

  <!-- Arrow -->
  <line x1="190" y1="100" x2="228" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Training Data -->
  <rect x="232" y="72" width="180" height="56" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="322" y="93" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">Training Data</text>
  <text x="322" y="110" text-anchor="middle" fill="#4ade80" font-size="10">DDLs &#8226; Q&amp;A Pairs &#8226; Docs</text>
  <text x="322" y="122" text-anchor="middle" fill="#4ade80" font-size="10">Ontologies &#8226; Documents</text>

  <!-- Arrow -->
  <line x1="412" y1="100" x2="448" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Embeddings Provider -->
  <rect x="452" y="72" width="180" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="542" y="93" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="600">Embeddings Provider</text>
  <text x="542" y="110" text-anchor="middle" fill="#60a5fa" font-size="10">OpenAI &#8226; Custom</text>
  <text x="542" y="122" text-anchor="middle" fill="#60a5fa" font-size="10">text &#8594; float[ ]</text>

  <!-- Arrow down from Embeddings Provider -->
  <line x1="542" y1="128" x2="542" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== ROW 2: Vector Store ========== -->
  <rect x="375" y="166" width="340" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="545" y="188" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">Vector Store</text>
  <rect x="388" y="198" width="68" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="422" y="216" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="500">Lucene</text>
  <rect x="462" y="198" width="44" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="484" y="216" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="500">H2</text>
  <rect x="512" y="198" width="56" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="540" y="216" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="500">SQLite</text>
  <rect x="574" y="198" width="56" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="602" y="216" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="500">HNSW</text>
  <rect x="636" y="198" width="44" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="658" y="216" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="500">LSH</text>

  <!-- Arrow down from Vector Store -->
  <line x1="545" y1="242" x2="545" y2="276" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="558" y="264" fill="#94a3b8" font-size="9">similar context</text>

  <!-- ========== ROW 3: Prompt Assembly + LLM ========== -->
  <rect x="140" y="280" width="220" height="60" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="303" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="600">Prompt Assembly</text>
  <text x="250" y="320" text-anchor="middle" fill="#fb923c" font-size="10">System + DDLs + Docs + Few-shot</text>
  <text x="250" y="332" text-anchor="middle" fill="#fb923c" font-size="10">+ Response Guidelines + Question</text>

  <!-- Arrow from Vector Store to Prompt Assembly -->
  <path d="M 445 246 Q 350 260 300 276" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from Prompt Assembly to LLM -->
  <line x1="360" y1="310" x2="438" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM Client -->
  <rect x="442" y="280" width="190" height="60" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="537" y="303" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="600">LLM Client</text>
  <text x="537" y="320" text-anchor="middle" fill="#f87171" font-size="10">OpenAI &#8226; Custom</text>
  <text x="537" y="332" text-anchor="middle" fill="#f87171" font-size="10">prompt &#8594; SQL / text</text>

  <!-- Arrow down from LLM -->
  <line x1="537" y1="340" x2="537" y2="378" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== ROW 4: SQL Pipeline ========== -->
  <rect x="420" y="382" width="170" height="50" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="403" text-anchor="middle" fill="#065f46" font-size="12" font-weight="600">SQL Extractor</text>
  <text x="505" y="418" text-anchor="middle" fill="#34d399" font-size="10">regex chain &#8226; validation</text>

  <!-- Arrow to DB -->
  <line x1="590" y1="407" x2="638" y2="407" stroke="#1DB954" stroke-width="1.5" marker-end="url(#arrow-brand)"/>

  <!-- Database -->
  <rect x="642" y="382" width="160" height="50" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="722" y="403" text-anchor="middle" fill="#0c4a6e" font-size="12" font-weight="600">Database</text>
  <text x="722" y="418" text-anchor="middle" fill="#38bdf8" font-size="10">BigQuery &#8226; Postgres &#8226; SQLite</text>

  <!-- Arrow down to Export -->
  <line x1="722" y1="432" x2="722" y2="462" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Export -->
  <rect x="642" y="466" width="160" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="722" y="490" text-anchor="middle" fill="#334155" font-size="11" font-weight="500">Export: JSON &#8226; CSV &#8226; Text</text>

  <!-- ========== LEFT COLUMN: Three Runners ========== -->
  <rect x="30" y="170" width="130" height="40" rx="8" fill="#1DB954" filter="url(#shadow)"/>
  <text x="95" y="195" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">QueryChat</text>

  <rect x="30" y="220" width="130" height="40" rx="8" fill="#1e40af" filter="url(#shadow)"/>
  <text x="95" y="245" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">LLMChat</text>

  <rect x="30" y="270" width="130" height="40" rx="8" fill="#9333ea" filter="url(#shadow)"/>
  <text x="95" y="295" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">LLMDiff</text>

  <!-- Label: Runners -->
  <text x="95" y="155" text-anchor="middle" fill="#475569" font-size="10" font-weight="600" letter-spacing="1">RAG RUNNERS</text>

  <!-- ========== Bottom: Feedback loop ========== -->
  <path d="M 420 417 Q 200 470 110 320" fill="none" stroke="#1DB954" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-brand)"/>
  <text x="200" y="456" fill="#1DB954" font-size="9" font-weight="500">train(question, sql)</text>

  <!-- ========== RIGHT: conversation history ========== -->
  <rect x="710" y="280" width="160" height="60" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="303" text-anchor="middle" fill="#854d0e" font-size="11" font-weight="600">Conversation History</text>
  <text x="790" y="320" text-anchor="middle" fill="#ca8a04" font-size="10">Multi-turn context</text>
  <text x="790" y="332" text-anchor="middle" fill="#ca8a04" font-size="10">Question rewriting</text>

  <!-- Arrow from history to prompt -->
  <path d="M 710 320 Q 600 350 360 315" fill="none" stroke="#eab308" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

</svg>
